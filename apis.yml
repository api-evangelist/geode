name: Geode
description: 'Geode Finance is a decentralized, trustless staking infrastructure protocol
  on Ethereum (with an earlier Avalanche v1 deployment) that lets anyone create and
  operate permissionless, configurable liquid-staking pools without intermediaries.
  Through its Portal router, isolated storage, dual governance, staking derivatives
  (gETH / gAVAX), an operator marketplace, withdrawal contracts, bound liquidity pools,
  and the Telescope oracle system, entities can launch their own liquid staking derivatives,
  isolate risk profiles, run KYC/AML-segregated pools, and earn sustainable maintenance-fee
  revenue. Developers integrate via the geodefi Python SDK and geo-vue UI components.'
